name: Visitor stats
on:
  schedule:
    - cron: "7 */4 * * *"   # every 4 hours (KST 01:07, 05:07, 09:07, 13:07, 17:07, 21:07)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: visitor-stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save mqtt@5.10.1
      - run: node scripts/collect_stats.mjs
      - name: Save stats
        run: |
          git config user.name "lake-bot"
          git config user.email "lake-bot@users.noreply.github.com"
          # re-apply this window on top of the latest main, so two windows never conflict
          cp stats/latest.json /tmp/latest.json
          msg="Visitor stats $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/latest.json stats/latest.json
            jq -c . /tmp/latest.json >> stats/history.jsonl
            git add stats && git commit -q -m "$msg" && git push -q origin HEAD:main && break
            sleep $((5 * i))
          done
      - name: Start the next window
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stats.yml -R ${{ github.repository }} --ref main
