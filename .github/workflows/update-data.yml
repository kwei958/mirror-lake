name: Update index data
on:
  schedule:
    - cron: "16 21 * * 0-5"   # 06:16 KST, Mon–Sat (no run on Sunday KST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_data.py
      - run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "lake-bot"
            git config user.email "lake-bot@users.noreply.github.com"
            git commit -am "Update index data $(date -u +%F)"
            git push
          fi
